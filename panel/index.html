<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CleanCam</title>
<link rel="icon" href="/cleancam.svg">
<style>
  :root { --yellow: #f5c518; --green: #3ddc84; --orange: #e68c00; }
  html[data-theme=dark] {
    --page: #121212; --card: #1e1e1e; --cardline: #2e2e2e; --text: #ffffff; --sub: #9e9e9e; --head: #8a8a8a;
    --seg: #2a2a2a; --segtext: #dddddd; --off: #3a3a3a; --knob: #bdbdbd; --drawer: #1a1a1a; --line: #2e2e2e;
    --shade: rgba(0, 0, 0, 0.55); --iconbtn: #2a2a2a;
  }
  html[data-theme=light] {
    --page: #f4f4f4; --card: #ffffff; --cardline: #e0e0e0; --text: #1a1a1a; --sub: #666666; --head: #7a7a7a;
    --seg: #ececec; --segtext: #333333; --off: #cfcfcf; --knob: #ffffff; --drawer: #ffffff; --line: #e6e6e6;
    --shade: rgba(0, 0, 0, 0.35); --iconbtn: #e8e8e8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text); font-family: "DejaVu Sans", system-ui, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  main { max-width: 1280px; margin: 0 auto; padding: 22px 32px 32px; }
  header { display: flex; align-items: center; gap: 16px; margin-bottom: 26px; }
  header h1 { flex: 1; margin: 0; font-size: 26px; }
  .iconbtn { width: 40px; height: 40px; border: 0; border-radius: 50%; background: var(--iconbtn);
    display: grid; place-items: center; }
  .card { background: var(--card); border: 1px solid var(--cardline); border-radius: 14px; }
  .hero { display: flex; justify-content: space-between; align-items: center; gap: 24px; min-height: 150px;
    padding: 28px 28px 28px 34px; }
  .state { display: flex; align-items: center; gap: 12px; font-size: 30px; font-weight: bold; }
  .dot { flex: none; width: 16px; height: 16px; border-radius: 50%; background: var(--sub); }
  .dot.green { background: var(--green); } .dot.yellow { background: var(--yellow); }
  .dot.orange { background: var(--orange); }
  .phone { display: flex; align-items: center; gap: 10px; margin-top: 22px; color: var(--sub); font-size: 16px; }
  .live { display: flex; gap: 56px; }
  .live b { display: block; font-size: 34px; }
  .live span { font-size: 13px; color: var(--head); }
  .power { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 20px 0; }
  .power .card { display: flex; justify-content: space-between; align-items: center; gap: 16px; height: 96px;
    padding: 0 28px; font-size: 20px; }
  .power small { display: block; margin-top: 4px; color: var(--sub); font-size: 13px; }
  .head { font-size: 12px; font-weight: bold; letter-spacing: 1.2px; color: var(--head); }
  .preset { padding: 22px 28px 28px; }
  .segs { display: flex; gap: 6px; margin-top: 14px; }
  .segs button { flex: 1; height: 44px; border: 0; border-radius: 8px; background: var(--seg); color: var(--segtext);
    font-size: 15px; }
  .segs button.on { background: var(--yellow); color: #111111; font-weight: bold; }
  .switch { position: relative; flex: none; width: 56px; height: 30px; border: 0; border-radius: 15px;
    background: var(--off); }
  .switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--knob); transition: left 0.15s; }
  .switch[aria-checked=true] { background: var(--yellow); }
  .switch[aria-checked=true]::after { left: 30px; background: #111111; }
  .switch.small { width: 44px; height: 24px; border-radius: 12px; }
  .switch.small::after { width: 16px; height: 16px; }
  .switch.small[aria-checked=true]::after { left: 24px; }
  .switch:disabled, .segs button:disabled, input:disabled { opacity: 0.45; cursor: default; }

  .shade { position: fixed; inset: 0; background: var(--shade); opacity: 0; pointer-events: none;
    transition: opacity 0.2s; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 420px; max-width: 100%; overflow-y: auto;
    padding: 22px 28px; background: var(--drawer); border-left: 1px solid var(--line); transform: translateX(100%);
    transition: transform 0.2s; }
  body.open .shade { opacity: 1; pointer-events: auto; }
  body.open .drawer { transform: none; }
  .drawer h2 { display: flex; align-items: center; gap: 8px; height: 40px; margin: 0 0 12px; font-size: 22px; }
  .drawer h2 .close { margin-left: auto; }
  .bare { border: 0; background: none; padding: 4px; display: grid; place-items: center; }
  .back { font-size: 30px; line-height: 1; padding: 0 6px 4px 0; }
  .row { display: flex; align-items: center; width: 100%; height: 64px; padding: 0; border: 0;
    border-bottom: 1px solid var(--line); background: none; font-size: 17px; text-align: left; }
  .row .value { margin-left: auto; margin-right: 12px; color: var(--sub); font-size: 15px; }
  .drawer .segs button { height: 34px; font-size: 13px; }
  .label { margin: 22px 0 0; color: var(--sub); font-size: 13px; }
  input[type=range] { width: 100%; margin: 12px 0 0; accent-color: var(--yellow); }
  .toggle { display: flex; align-items: center; gap: 12px; margin-top: 20px; font-size: 15px; }
  .note { margin-top: 14px; color: var(--head); font-size: 12px; line-height: 1.5; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
      <rect width="44" height="44" rx="10" fill="#f5c518"/>
      <circle cx="22" cy="22" r="13" fill="#121212"/><circle cx="22" cy="22" r="6" fill="#f5c518"/>
      <circle cx="36" cy="8" r="3" fill="#121212"/>
    </svg>
    <h1>CleanCam</h1>
    <button class="iconbtn" id="theme" title="Light or dark theme" aria-label="Light or dark theme">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
        <circle cx="11" cy="11" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M11 2 A9 9 0 0 1 11 20 Z" fill="currentColor"/>
      </svg>
    </button>
    <button class="iconbtn" id="menu" title="Settings" aria-label="Settings">
      <svg width="20" height="16" viewBox="0 0 20 16" aria-hidden="true" fill="currentColor">
        <rect y="1" width="20" height="2.5" rx="1.25"/><rect y="6.75" width="20" height="2.5" rx="1.25"/>
        <rect y="12.5" width="20" height="2.5" rx="1.25"/>
      </svg>
    </button>
  </header>

  <section class="card hero">
    <div>
      <div class="state"><span class="dot" id="dot"></span><span id="status">Starting…</span></div>
      <div class="phone">
        <span id="phone"></span>
        <span id="battery" hidden>
          <svg width="34" height="17" viewBox="0 0 34 17" aria-hidden="true" style="vertical-align: -2px">
            <rect x="1" y="1" width="28" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <rect x="29.5" y="5" width="3" height="7" rx="1" fill="currentColor"/>
            <rect id="battery-fill" x="3" y="3" width="24" height="11" rx="1.5" fill="#3ddc84"/>
            <path id="battery-bolt" d="M16 3 L11 9 H15 L13 14 L19 7 H15 Z" fill="#111111"/>
          </svg>
          <span id="battery-level"></span>
        </span>
      </div>
    </div>
    <div class="live">
      <div><b id="fps">–</b><span>fps</span></div>
      <div><b id="mbps">–</b><span>Mbps</span></div>
      <div><b id="size">–</b><span>&nbsp;</span></div>
    </div>
  </section>

  <section class="power">
    <div class="card"><div>Receiver<small id="receiver-note" hidden></small></div>
      <button class="switch" id="receiver" role="switch" aria-checked="false" aria-label="Receiver"></button></div>
    <div class="card"><div>Phone app<small id="app-note" hidden></small></div>
      <button class="switch" id="app" role="switch" aria-checked="false" aria-label="Phone app"></button></div>
  </section>

  <section class="card preset">
    <div class="head">PRESET</div>
    <div class="segs" id="preset"></div>
  </section>
</main>

<div class="shade" id="shade"></div>
<aside class="drawer" id="drawer" aria-label="Settings">
  <div class="layer" data-layer="list">
    <h2>Settings<button class="bare close" aria-label="Close">✕</button></h2>
    <button class="row" data-open="camera">Camera<span class="value" id="v-camera"></span>›</button>
    <button class="row" data-open="bitrate">Max bitrate<span class="value" id="v-bitrate"></span>›</button>
    <button class="row" data-open="autooff">Auto off<span class="value" id="v-autooff"></span>›</button>
    <button class="row" data-open="phone">On the phone<span class="value" id="v-phone"></span>›</button>
  </div>
  <div class="layer" data-layer="camera" hidden>
    <h2><button class="bare back" aria-label="Back">‹</button>Camera<button class="bare close" aria-label="Close">✕</button></h2>
    <div class="label">Lens</div>
    <div class="segs" id="lens"></div>
    <div class="label">Stabilization</div>
    <div class="segs" id="stab"></div>
    <div class="label" id="ev-label">Exposure +0.0 EV</div>
    <input type="range" id="ev" min="-2" max="2" step="0.1" value="0" aria-labelledby="ev-label">
    <div class="toggle"><button class="switch small" id="near" role="switch" aria-checked="false"
      aria-labelledby="near-label"></button><span id="near-label">Near focus</span></div>
    <div class="toggle"><button class="switch small" id="awb" role="switch" aria-checked="true"
      aria-labelledby="awb-label"></button><span id="awb-label">Auto white balance</span></div>
    <div id="wb-box" hidden>
      <div class="label" id="wb-label">White balance 5000 K</div>
      <input type="range" id="wb" min="2500" max="8000" step="100" value="5000" aria-labelledby="wb-label">
    </div>
  </div>
  <div class="layer" data-layer="bitrate" hidden>
    <h2><button class="bare back" aria-label="Back">‹</button>Max bitrate<button class="bare close" aria-label="Close">✕</button></h2>
    <div class="segs" id="maxbitrate"></div>
    <div class="note">The stream never sends more, whatever the preset and the link allow.</div>
  </div>
  <div class="layer" data-layer="autooff" hidden>
    <h2><button class="bare back" aria-label="Back">‹</button>Auto off<button class="bare close" aria-label="Close">✕</button></h2>
    <div class="segs" id="autooff"></div>
    <div class="note" id="autooff-note"></div>
  </div>
  <div class="layer" data-layer="phone" hidden>
    <h2><button class="bare back" aria-label="Back">‹</button>On the phone<button class="bare close" aria-label="Close">✕</button></h2>
    <div class="toggle"><button class="switch small" id="mute" role="switch" aria-checked="false"
      aria-labelledby="mute-label"></button><span id="mute-label">Mute</span></div>
    <div class="toggle"><button class="switch small" id="lock" role="switch" aria-checked="false"
      aria-labelledby="lock-label"></button><span id="lock-label">Lock</span></div>
    <div class="toggle"><button class="switch small" id="screen" role="switch" aria-checked="false"
      aria-labelledby="screen-label"></button><span id="screen-label">Screen off</span></div>
  </div>
</aside>

<script>
const $ = (id) => document.getElementById(id);
let state = {};

// The theme starts as the PC's own and keeps the user's pick.
const themeQuery = matchMedia("(prefers-color-scheme: dark)");
function applyTheme() {
  document.documentElement.dataset.theme = localStorage.getItem("theme") || (themeQuery.matches ? "dark" : "light");
}
applyTheme();
themeQuery.addEventListener("change", applyTheme);
$("theme").onclick = () => {
  localStorage.setItem("theme", document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  applyTheme();
};

// The drawer: a list of layers, one open at a time.
function showLayer(name) {
  for (const layer of document.querySelectorAll(".layer")) layer.hidden = layer.dataset.layer !== name;
}
function setDrawer(open) {
  document.body.classList.toggle("open", open);
  if (open) showLayer("list");
}
$("menu").onclick = () => setDrawer(true);
$("shade").onclick = () => setDrawer(false);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") setDrawer(false); });
for (const b of document.querySelectorAll(".close")) b.onclick = () => setDrawer(false);
for (const b of document.querySelectorAll(".back")) b.onclick = () => showLayer("list");
for (const b of document.querySelectorAll("[data-open]")) b.onclick = () => showLayer(b.dataset.open);

async function post(path, body) {
  await fetch(path, {
    method: "POST", headers: { "Content-Type": "application/json", "X-CleanCam": "1" }, body: JSON.stringify(body),
  });
  setTimeout(poll, 300);
}
const send = (line) => post("/api/command", { line });

// A row of buttons that picks one value and sends its command.
function segs(id, items, command) {
  const box = $(id);
  for (const [value, label] of items) {
    const b = document.createElement("button");
    b.textContent = label;
    b.dataset.value = value;
    b.onclick = () => send(command(value));
    box.append(b);
  }
}
function pick(id, value, enabled) {
  for (const b of $(id).children) {
    b.classList.toggle("on", b.dataset.value === String(value));
    b.disabled = !enabled;
  }
}
function setSwitch(id, on, enabled = true) {
  $(id).setAttribute("aria-checked", String(on));
  $(id).disabled = !enabled;
}
const checked = (id) => $(id).getAttribute("aria-checked") === "true";

segs("preset", [["call", "Call"], ["lowlight", "Low light"], ["obs", "OBS"], ["wifi", "WiFi"], ["4k", "4K"]],
  (v) => `preset ${v}`);
segs("lens", [["auto", "Auto"], ["ultrawide", "Ultra wide"], ["wide", "Wide"]], (v) => `lens ${v}`);
segs("stab", [["auto", "Auto"], ["off", "Off"], ["standard", "Standard"], ["cinematic", "Cinematic"]],
  (v) => `stab ${v}`);
segs("maxbitrate", [["off", "No limit"], ["20000000", "20 Mbps"], ["10000000", "10 Mbps"], ["6000000", "6 Mbps"],
  ["3000000", "3 Mbps"]], (v) => `maxbitrate ${v}`);
segs("autooff", [["1", "1 min"], ["5", "5 min"], ["15", "15 min"], ["30", "30 min"], ["never", "Never"]],
  (v) => `autooff ${v}`);

$("receiver").onclick = () => post("/api/receiver", { on: !checked("receiver") });
$("app").onclick = () => post("/api/app", { on: !checked("app") });
$("near").onclick = () => send(`near ${checked("near") ? "off" : "on"}`);
$("awb").onclick = () => send(checked("awb") ? `wb ${$("wb").value}` : "wb auto");
for (const id of ["mute", "lock"]) $(id).onclick = () => send(`${id} ${checked(id) ? "off" : "on"}`);
$("screen").onclick = () => send(`screen ${checked("screen") ? "on" : "off"}`);
const evText = (ev) => `Exposure ${ev >= 0 ? "+" : "−"}${Math.abs(ev).toFixed(1)} EV`;
$("ev").oninput = () => { $("ev-label").textContent = evText(Number($("ev").value)); };
$("ev").onchange = () => send(`ev ${$("ev").value}`);
$("wb").oninput = () => { $("wb-label").textContent = `White balance ${$("wb").value} K`; };
$("wb").onchange = () => send(`wb ${$("wb").value}`);

const LENSES = { auto: "Auto lens", ultrawide: "Ultra wide", wide: "Wide", tele: "Tele" };
const minutes = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

function render() {
  const { phone, app, second, mode, camera, receiver } = state;
  const streaming = app && second && second.viewers.video > 0;
  const idle = second && second.idle;
  let status, dot;
  if (!phone) [status, dot] = ["Panel not running", ""];
  else if (phone === "none") [status, dot] = ["Phone not connected", ""];
  else if (phone === "unauthorized") [status, dot] = ["Allow USB debugging", "orange"];
  else if (!app) [status, dot] = [state.keyguard ? "Unlock the phone" : "CleanCam is closed", ""];
  else if (streaming) [status, dot] = ["Streaming to PC", "green"];
  else [status, dot] = ["Waiting for the receiver", "yellow"];
  $("status").textContent = status;
  $("dot").className = `dot ${dot}`;

  let phoneText = phone === "device" ? `${state.model || "Phone"} · USB` : "";
  if (idle && idle.limit > 0 && idle.limit - idle.seconds <= 30) phoneText += ` · Off in ${idle.limit - idle.seconds} s`;
  $("phone").textContent = phoneText;
  const battery = phone === "device" && state.battery;
  $("battery").hidden = !battery;
  if (battery) {
    $("battery-fill").setAttribute("width", String(24 * battery.level / 100));
    $("battery-fill").setAttribute("fill", battery.level <= 20 && !battery.charging ? "#e5484d" : "#3ddc84");
    $("battery-bolt").style.display = battery.charging ? "" : "none";
    $("battery-level").textContent = `${battery.level}%`;
  }

  $("fps").textContent = app && second ? second.fps : "–";
  $("mbps").textContent = app && second ? (second.target / 1e6).toFixed(second.target < 1e7 ? 1 : 0) : "–";
  $("size").textContent = app && mode ? (mode.height >= 2160 ? "4K" : `${mode.height}p`) : "–";

  setSwitch("receiver", !!(receiver && receiver.running), !!phone);
  $("receiver-note").hidden = !(receiver && receiver.error);
  $("receiver-note").textContent = receiver ? receiver.error : "";
  setSwitch("app", !!app, phone === "device");

  pick("preset", mode ? mode.preset : "", !!app);

  // The drawer's values, and each layer's controls
  const lens = camera ? camera.lens.asked : "";
  $("v-camera").textContent = LENSES[lens] || "";
  pick("lens", lens, !!camera);
  pick("stab", camera ? camera.stabilization.asked : "", !!camera);
  const ev = camera ? camera.exposureBias.asked : 0;
  if (document.activeElement !== $("ev")) {
    $("ev").value = ev;
    $("ev-label").textContent = evText(ev);
  }
  $("ev").disabled = !camera;
  setSwitch("near", !!(camera && camera.nearFocus.asked), !!camera);
  const wb = camera ? camera.whiteBalance.asked : "auto";
  setSwitch("awb", wb === "auto", !!camera);
  $("wb-box").hidden = wb === "auto";
  if (wb !== "auto" && document.activeElement !== $("wb")) {
    $("wb").value = wb;
    $("wb-label").textContent = `White balance ${wb} K`;
  }

  const maxRate = camera ? camera.maxBitRate : undefined;
  $("v-bitrate").textContent = !camera ? "" : maxRate ? `${maxRate / 1e6} Mbps` : "No limit";
  pick("maxbitrate", maxRate ? maxRate : "off", !!camera);

  const limit = idle ? idle.limit / 60 : null;
  $("v-autooff").textContent = !idle ? "" : (limit ? `${limit} min` : "Never") + (idle.pcUsing ? " · in use" : "");
  pick("autooff", limit === null ? "" : limit ? limit : "never", !!idle);
  $("autooff-note").textContent = !idle ? "" : !limit ? "The app stays on." :
    idle.pcUsing ? "A PC app uses the webcam or microphone, so the app stays on." :
    idle.seconds > 0 ? `Still and unused for ${minutes(idle.seconds)}; off at ${limit}:00.` :
    "Counts while the phone is still and untouched and no PC app uses it.";

  const p = second && second.phone;
  setSwitch("mute", !!(p && p.muted), !!p);
  setSwitch("lock", !!(p && p.locked), !!p);
  setSwitch("screen", !!(p && p.screenOff), !!p);
  $("v-phone").textContent = !p ? "" : [p.muted && "Muted", p.locked && "Locked", p.screenOff && "Screen off"]
    .filter(Boolean).join(" · ");
}

async function poll() {
  try {
    state = await (await fetch("/api/state")).json();
  } catch {
    state = {};
  }
  render();
}
setInterval(poll, 1000);
poll();
</script>
</body>
</html>
